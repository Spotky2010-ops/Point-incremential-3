<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Point Incremential 3</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="start-screen" class="modal visible">
      <div class="modal-card">
        <p class="eyebrow">Version 0.1.1 — Major Rank Update</p>
        <h1>Point Incremential 3</h1>
        <p>Earn points, buy upgrades, Prestige, and Rank Up.</p>
        <button id="start-button" class="primary-button">Start Game</button>
      </div>
    </div>

    <div class="app hidden" id="game-app">
      <header class="topbar">
        <div>
          <p class="eyebrow">Currency</p>
          <h2 id="points">0</h2>
        </div>

        <div class="stats-box">
          <div>
            <span>Per Click</span>
            <strong id="per-click">1</strong>
          </div>
          <div>
            <span>Per Second</span>
            <strong id="per-second">0</strong>
          </div>
          <div>
            <span>Prestige</span>
            <strong id="prestige-display">0</strong>
          </div>
          <div>
            <span>Rank</span>
            <strong id="rank-display">0</strong>
          </div>
        </div>

        <div class="settings-shell">
          <button id="settings-toggle" class="settings-toggle" type="button" aria-expanded="false" aria-controls="settings-dropdown">
            <span class="settings-toggle__icon">⚙️</span>
            <span class="settings-toggle__label">Settings</span>
            <span id="theme-status-badge" class="theme-status-badge" title="Theme saved locally">Saved: Auto</span>
          </button>

          <div id="settings-dropdown" class="settings-dropdown" role="menu" aria-label="Theme settings">
            <div class="settings-group">
              <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch theme" aria-pressed="false">
                <span class="theme-toggle__icon">🌙</span>
                <span class="theme-toggle__label">Dark</span>
              </button>
              <button id="theme-mode" class="theme-mode" type="button" aria-label="Change theme mode">
                <span class="theme-mode__icon">◐</span>
                <span class="theme-mode__label">Auto</span>
              </button>
            </div>
          </div>
        </div>
      </header>

      <main class="game-layout">
        <section class="panel main-panel">
          <button id="gain-points" class="main-button">Get Points!</button>

          <div class="prestige-panel">
            <div>
              <p class="eyebrow">Rank Up</p>
              <h3>Reset for permanent boosts and a higher rank</h3>
            </div>
            <button id="rank-up-button" class="secondary-button">Rank Up</button>
            <button id="prestige-button" class="secondary-button hidden" aria-hidden="true">Prestige</button>
            <p id="prestige-info" class="muted">Need 1,000 points to Prestige</p>
            <p id="rank-info" class="muted">Need 1,000 points to rank up.</p>
          </div>
        </section>

        <section class="panel shop-panel">
          <div class="shop-header">
            <h3>Point Upgrades</h3>
            <button id="reset-save" class="mini-button">Reset Save</button>
          </div>
          <div id="upgrades" class="upgrades"></div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
